- name: Reload sysctl
  ansible.builtin.command: sysctl --system
  changed_when: true

- name: Sysctl flush ipv4 route table
  when:
    - deb11cis_flush_ipv4_route
    - not system_is_container
  ansible.posix.sysctl:
    name: net.ipv4.route.flush
    value: '1'
    sysctl_set: true
  ignore_errors: true  # noqa ignore-errors

- name: Sysctl flush ipv6 route table
  when:
    - deb11cis_flush_ipv6_route
    - not system_is_container
  ansible.posix.sysctl:
    name: net.ipv6.route.flush
    value: '1'
    sysctl_set: true

- name: Restart timeservice
  ansible.builtin.systemd:
    name: "{{ deb11cis_time_sync_tool }}"
    state: restarted

- name: Restart firewalld
  ansible.builtin.systemd:
    name: firewalld
    state: restarted

- name: Restart sshd | Validate sshd configuration
  listen: Restart sshd
  ansible.builtin.command: sshd -t
  changed_when: false

- name: Restart sshd | Restart sshd service
  listen: Restart sshd
  ansible.builtin.systemd:
    name: sshd
    state: restarted

- name: Restart postfix
  ansible.builtin.systemd:
    name: postfix
    state: restarted

- name: Update dconf
  ansible.builtin.command: dconf update
  changed_when: true

- name: Update-grub
  ansible.builtin.command: "update-grub"
  changed_when: true
  ignore_errors: true  # noqa ignore-errors

- name: Reload ufw
  community.general.ufw:
    state: reloaded

- name: Restart rsyslog
  ansible.builtin.systemd:
    name: rsyslog
    state: restarted

- name: Restart journald
  ansible.builtin.systemd:
    name: systemd-journald
    state: restarted

- name: Restart systemd_journal_upload
  ansible.builtin.systemd:
    name: systemd-journal-upload
    state: restarted

- name: Systemd_daemon_reload
  ansible.builtin.systemd:
    daemon-reload: true

- name: Pam_auth_update_pwunix
  ansible.builtin.command: pam-auth-update --enable {{ deb11cis_pam_pwunix_file }}
  changed_when: true

- name: Pam_auth_update_pwfaillock
  ansible.builtin.command: pam-auth-update --enable {{ deb11cis_pam_faillock_file }}
  changed_when: true

- name: Pam_auth_update_pwfaillock_notify
  ansible.builtin.command: pam-auth-update --enable {{ deb11cis_pam_faillock_notify_file }}
  changed_when: true

- name: Pam_auth_update_pwquality
  ansible.builtin.command: pam-auth-update --enable {{ deb11cis_pam_pwquality_file }}
  changed_when: true

- name: Pam_auth_update_pwhistory
  ansible.builtin.command: pam-auth-update --enable {{ deb11cis_pam_pwhistory_file }}
  changed_when: true

## Auditd tasks note order for handlers to run

- name: Auditd rules reload
  when:
    - not prelim_auditd_immutable_check
    - not system_is_container
  ansible.builtin.command: augenrules --load
  changed_when: true

- name: Audit immutable fact
  when:
    - prelim_auditd_immutable_check is defined
    - not system_is_container
  ansible.builtin.debug:
    msg: "Reboot required for auditd to apply new rules as immutable set"
  notify: Change_requires_reboot

- name: Stop auditd process
  when: not system_is_container
  ansible.builtin.command: systemctl kill auditd
  changed_when: true
  listen: Restart auditd

- name: Start auditd process
  when: not system_is_container
  ansible.builtin.systemd_service:
    name: auditd
    state: started
  listen: Restart auditd

- name: Change_requires_reboot
  ansible.builtin.set_fact:
    change_requires_reboot: true
